name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # verifyPlugin downloads the target IDE and its plugins (~1 GB) on a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Plugin Verifier downloads
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: plugin-verifier-${{ runner.os }}-
      - name: Test, build, verify plugin structure and IDE compatibility
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPlugin --no-daemon
      - name: Upload plugin zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umldoclet-intellij
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  # The runner E2E drives the real javadoc + UMLDoclet on Windows: argfile with a drive-letter path
  # containing spaces (UmlDocletRunnerTest). The UmlTargets fixture tests stay on Linux.
  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Runner end-to-end tests on Windows
        run: ./gradlew test --tests "dev.petalnet.umldoclet.UmlDocletRunnerTest" --tests "dev.petalnet.umldoclet.UmlDocletRunnerUnitTest" --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: build/reports/tests/
