name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # verifyPlugin downloads the target IDE and its plugins (~1 GB) on a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Plugin Verifier downloads
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: plugin-verifier-${{ runner.os }}-
      - name: Test, build and verify with the tag's version
        run: ./gradlew -PpluginVersion="${GITHUB_REF_NAME#v}" test buildPlugin verifyPluginStructure verifyPlugin --no-daemon
      - name: Create GitHub release with the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
